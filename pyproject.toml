[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplforecast-engine"
version = "0.1.0"
description = "Headless FPL projection library (engine/) for the FPL Decision Engine."
requires-python = ">=3.12"
dependencies = ["pandas", "numpy"]

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
