name: Snapshot FPL data

on:
  schedule:
    # 03:00 UTC daily = 11:00 SGT. Cheap, and gives the season a full daily history
    # instead of just the weekly cadence the rest of the plan uses.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and the engine package
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run snapshotter
        env:
          FPL_TEAM_ID: "1168513"
        run: python scripts/snapshot.py

      - name: Ingest multi-season history archive
        # Cheap once data/history/ is populated — existing gameweek files are skipped.
        run: python scripts/ingest_history.py

      - name: Resolve player identities across past seasons
        run: python scripts/resolve_entities.py

      - name: Fit minutes model
        run: python scripts/minutes_model.py

      - name: Log pre-deadline predictions
        # No-op outside the 48h window before a deadline, or once the file exists.
        run: python scripts/log_predictions.py

      - name: Score finished gameweeks
        run: python scripts/score_predictions.py

      - name: Compute forecast
        run: python scripts/compute_forecast.py

      - name: Commit snapshot
        run: |
          git config user.name "fpl-snapshotter"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Snapshot FPL data $(date -u +%Y-%m-%d)"
            git push
          fi
