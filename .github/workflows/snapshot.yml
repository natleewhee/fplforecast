name: Snapshot FPL data

on:
  schedule:
    # 03:00 UTC daily = 11:00 SGT. Cheap, and gives the season a full daily history
    # instead of just the weekly cadence the rest of the plan uses.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# One run at a time. A transfer saved in the app dispatches a run; if the daily
# run (or another save) is already going, this one waits its turn instead of
# racing it for the final push. A queued run is replaced by a newer queued one,
# which is fine: each run reads the latest saved transfers when it starts.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and the engine package
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run snapshotter
        env:
          FPL_TEAM_ID: "1168513"
        run: python scripts/snapshot.py

      - name: Ingest multi-season history archive
        # Cheap once data/history/ is populated — existing gameweek files are skipped.
        run: python scripts/ingest_history.py

      - name: Ingest cross-league xG (newcomers)
        # ~45s: 5 leagues x 2 seasons from Understat, rate-limited. Non-fatal.
        run: python scripts/ingest_understat.py || echo "understat ingest failed — newcomers fall back to the price prior"

      - name: Resolve player identities across past seasons
        run: python scripts/resolve_entities.py

      - name: Fit minutes model
        run: python scripts/minutes_model.py

      - name: Log pre-deadline predictions
        # No-op outside the 48h window before a deadline, or once the file exists.
        run: python scripts/log_predictions.py

      - name: Score finished gameweeks
        run: python scripts/score_predictions.py

      - name: Score par calibration
        run: python scripts/score_par_calibration.py

      - name: Compute forecast
        run: python scripts/compute_forecast.py

      - name: Commit snapshot
        run: |
          git config user.name "fpl-snapshotter"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Snapshot FPL data $(date -u +%Y-%m-%d)"
          # Something else (a merged PR) can land on this branch while the job
          # runs, which makes a plain push a non-fast-forward rejection even
          # though every step above succeeded. Only data/ changes here, so
          # replaying the commit on top of the newer branch is safe; a real
          # conflict aborts and fails the job (and raises the alert below).
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest ${GITHUB_REF_NAME}"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Rebase conflict; giving up"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Could not push after 4 attempts"
          exit 1

      - name: Raise an issue if the snapshot failed
        # The daily run once failed silently for almost two weeks (an
        # incompatible library release). A failed run now opens one issue, and
        # adds a comment on each further failure, so GitHub emails you.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily snapshot is failing"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The snapshot run failed on $(date -u +%Y-%m-%d). The forecast on the site stops updating until it is fixed. Run: ${url}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || true
          else
            gh issue create --title "${title}" --body "${body}" || true
          fi

      - name: Close the failure issue once it passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily snapshot is failing"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "The snapshot is passing again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          fi
